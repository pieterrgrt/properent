<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Beheer | Properent</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="beheer.css">
</head>
<body class="beheer">

  <!-- Inloggen -->
  <section id="scherm-login" class="login" hidden>
    <form class="form-card login-card" id="login-form">
      <div class="brand" style="margin-bottom:18px">
        <img src="../assets/img/logo-mark.svg" alt="" width="40" height="40">
        <span>properent</span>
      </div>
      <h1>Beheer</h1>
      <div class="field">
        <label for="l-email">E-mailadres</label>
        <input id="l-email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="l-ww">Wachtwoord</label>
        <input id="l-ww" name="wachtwoord" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-dark btn-block" type="submit">Inloggen</button>
      <p class="form-status" id="login-status" role="alert"></p>
      <p class="muted" style="font-size:.9rem;margin:14px 0 0"><a href="#" id="ww-vergeten">Wachtwoord vergeten?</a></p>
    </form>
  </section>

  <!-- Nog niet ingesteld -->
  <section id="scherm-setup" class="login" hidden>
    <div class="form-card login-card">
      <h1>Beheer nog niet ingesteld</h1>
      <p>Vul <code>supabaseUrl</code> en <code>supabaseAnonKey</code> in <code>assets/js/config.js</code> in. De stappen staan in <code>docs/BEHEER.md</code>.</p>
      <a class="btn btn-ghost" href="../index.html">Naar de website</a>
    </div>
  </section>

  <!-- App -->
  <div id="scherm-app" hidden>
    <header class="admin-bar">
      <div class="wrap">
        <a class="brand" href="#overzicht">
          <img src="../assets/img/logo-mark-wit.svg" alt="" width="34" height="34">
          <span>properent</span><em>beheer</em>
        </a>
        <nav class="admin-tabs" aria-label="Beheer">
          <a href="#overzicht">Overzicht</a>
          <a href="#woningen">Woningen</a>
          <a href="#aanvragen">Aanvragen <b class="teller" id="teller-nieuw" hidden></b></a>
          <a href="#huurders">Huurders</a>
        </nav>
        <div class="admin-user">
          <a href="../index.html" target="_blank" rel="noopener">Website ↗</a>
          <button class="btn btn-ghost btn-sm" id="uitloggen" type="button">Uitloggen</button>
        </div>
      </div>
    </header>
    <main class="wrap admin-main" id="view" aria-live="polite"></main>
  </div>

  <dialog id="dlg" class="dlg"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../data/woningen.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="demo.js"></script>
  <script src="beheer.js"></script>
</body>
</html>
